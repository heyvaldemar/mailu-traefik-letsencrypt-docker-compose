# The previous release cannot boot on the root zone as it is signed since
# 2026-10-11: its resolver trusts only the retired root key, answers SERVFAIL to
# every name, and Mailu's admin refuses to start. The drill grafts this
# release's trust-anchor fix onto it so it still proves the data upgrade.
# Delete this file once the previous release carries the fix.
services:
  resolver:
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' \
          '. IN DS 20326 8 2 E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D' \
          '. IN DS 38696 8 2 683D2D0ACB8C9B712A1948B27F741219298D0A450D612C483AF444A4C0FB2B16' \
          > /etc/unbound/trusted-key.key
        exec /start.py
