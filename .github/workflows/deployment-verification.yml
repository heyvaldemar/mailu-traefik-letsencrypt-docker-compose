name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: front
            env_var: FRONT_IMAGE_TAG
          - name: admin
            env_var: ADMIN_IMAGE_TAG
          - name: imap
            env_var: IMAP_IMAGE_TAG
          - name: smtp
            env_var: SMTP_IMAGE_TAG
          - name: antispam
            env_var: ANTISPAM_IMAGE_TAG
          - name: antivirus
            env_var: ANTIVIRUS_IMAGE_TAG
          - name: webmail
            env_var: WEBMAIL_IMAGE_TAG
          - name: traefik
            env_var: TRAEFIK_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\$\\{${ENV_VAR}:-.*" mailu-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  deploy-and-test:
    name: docker compose up + Mailu admin/webmail/SMTP smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      NETWORK_TWO: traefik-network
      DOCKER_COMPOSE_FILE: mailu-traefik-letsencrypt-docker-compose.yml
      APP_HOSTNAME: mail.heyvaldemarmu.net
      APP_TRAEFIK_HOSTNAME: traefik.mailu.heyvaldemarmu.net
      COMPOSE_PROJECT_NAME: mailu

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the external Docker network
        run: docker network create "$NETWORK_TWO" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          MAILU_HOSTNAME=${APP_HOSTNAME}
          MAILU_ADMIN_HOSTNAME=admin.mailu.heyvaldemarmu.net
          MAILU_WEBDAV_HOSTNAME=dav.mailu.heyvaldemarmu.net
          SECRET_KEY=$(openssl rand -hex 16)
          DOMAIN=heyvaldemarmu.net
          HOSTNAMES=${APP_HOSTNAME}
          POSTMASTER=admin
          TLS_FLAVOR=notls
          INITIAL_ADMIN_ACCOUNT=admin
          INITIAL_ADMIN_DOMAIN=heyvaldemarmu.net
          INITIAL_ADMIN_PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          INITIAL_ADMIN_MODE=update
          WEB_ADMIN=/admin
          WEB_WEBMAIL=/webmail
          WEBROOT_REDIRECT=/webmail
          ADMIN=true
          WEBMAIL=roundcube
          WEBDAV=radicale
          ANTIVIRUS=clamav
          SCAN_MACROS=true
          FETCHMAIL_ENABLED=true
          MESSAGE_SIZE_LIMIT=50000000
          SUBNET=192.168.203.0/24
          REDIS_ADDRESS=redis
          TZ=UTC
          MAILU_BACKUP_INIT_SLEEP=15s
          MAILU_BACKUP_INTERVAL=60s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        env:
          # clamav downloads its signature database on first start, hundreds of
          # megabytes, and reports unhealthy until it has. The smoke below does not
          # wait on it either; the mail path is what this stack is judged by.
          UPGRADE_DRILL_IGNORE: antivirus
        # A fresh stack proves the new image starts. It proves nothing about the
        # data a deployed host already has: whether the new database image accepts
        # the old data directory, whether the application's migrations run on a
        # populated schema. So the previous release is started first, on this
        # project's volumes, and the ordinary `up -d` below then recreates the
        # changed containers on top of it - which is exactly what `git pull &&
        # docker compose up -d` does on a deployed host. Every smoke check that
        # follows judges the upgraded stack, not a fresh one.
        run: |
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then
            echo "no previous release: nothing to upgrade from, the fresh start below is the whole test"
            exit 0
          fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          if git diff --quiet "$prev" -- "$DOCKER_COMPOSE_FILE"; then
            echo "the compose file is unchanged since $prev: nothing to drill"
            exit 0
          fi
          git show "$prev:$DOCKER_COMPOSE_FILE" > .upgrade-drill-previous.yml
          echo "starting $prev on this project's volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" up -d
          # Healthy means: every container is running and healthy (or running
          # with no health check), or exited 0 (a one-shot init container).
          # UPGRADE_DRILL_IGNORE names services the smoke below does not wait on
          # either - a container whose first start is a long download, with a
          # health check that stays red until it finishes.
          bad=""
          for _ in $(seq 1 60); do
            bad="$(docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" ps -a --format json \
              | jq -rs --arg ignore " ${UPGRADE_DRILL_IGNORE:-} " '[.[] | select((" " + .Service + " ") as $svc | ($ignore | contains($svc)) | not) | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad. Either the variable contract changed - then the changelog must say so - or $prev was never green here."
            docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" down
          rm -f .upgrade-drill-previous.yml
          echo "the start below is now an upgrade from $prev"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts

      - name: Print Docker Compose services status
        run: docker ps


      - name: Wait for the Mailu admin UI through Traefik
        # The admin container refuses to start until its DNSSEC-validating
        # resolver works, so /admin answering through the chain (Traefik ->
        # front -> admin) proves resolver, front routing, and the admin
        # database in one signal. First start creates the initial admin
        # account from .env.
        run: |
          # shellcheck disable=SC2016
          timeout 12m bash -c 'while ! curl -skL -o /dev/null -w "%{http_code}" "https://$APP_HOSTNAME/admin/" | grep -qE "^(200|302)$"; do
            echo "Waiting for the Mailu admin UI..."
            sleep 10
          done'
          curl -skL "https://$APP_HOSTNAME/admin/" -o /dev/null -w "Mailu admin UI: %{http_code}\n"
          curl -skL "https://$APP_HOSTNAME/webmail/" -o /dev/null -w "Webmail: %{http_code}\n"

      - name: Verify the SMTP port answers through the Traefik TCP router
        run: |
          timeout 2m bash -c 'until timeout 5 bash -c ":> /dev/tcp/127.0.0.1/25"; do sleep 5; done'
          banner="$(timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1/25; head -c 40 <&3')"
          echo "SMTP banner: $banner"
          case "$banner" in
            220*) echo "SMTP answers through Traefik" ;;
            *) echo "::error::Unexpected SMTP banner"; exit 1 ;;
          esac

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line is complete by
        # definition, so this never races an archive still being written.
        run: |
          # shellcheck disable=SC2016
          # The application creates its database on first start, later than the
          # first backup cycle; wait for the cycle that actually copied it.
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -qE "Database backup (OK|FAILED)"; do echo "Waiting for a backup cycle that saw the database..."; sleep 10; done'
          db=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Database backup OK" | tail -1 | sed -E 's/.*Database backup OK: ([^ ]+) .*/\1/')
          [ -n "$db" ] || { echo "::error::no 'Database backup OK' line"; exit 1; }
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "gunzip -c '$db' > /tmp/check.db && python3 -c \"import sqlite3; c=sqlite3.connect('/tmp/check.db'); r=c.execute('pragma integrity_check').fetchone()[0]; print('integrity:', r); raise SystemExit(0 if r=='ok' else 1)\"" && echo "Database backup valid: $db"
          data=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the data archive failed"; exit 1; }
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "tar -tzf '$data' > /dev/null" && echo "Data backup valid: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Scenarios against the live stack: required-env guard, backup set
        # produced, archive and database copy valid, failure detected when the
        # backups directory cannot be written, restore genuinely replaces the
        # data (application stopped, copy put back, marker gone), prune keeps
        # recent files. Same script a maintainer runs on a staging copy.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Wait for the Traefik dashboard to be ready
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'while ! curl -fsSLk --write-out "%{http_code}" --output /dev/null "https://$APP_TRAEFIK_HOSTNAME" | grep -E "200|401"; do
            echo "Waiting for the dashboard to be ready..."
            sleep 10
          done'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
