# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c}}
  redis: &redis-image ${REDIS_IMAGE_TAG:-redis:${REDIS_IMAGE_VERSION:-7.4@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85}}
  resolver: &resolver-image ${RESOLVER_IMAGE_TAG:-ghcr.io/mailu/unbound:${RESOLVER_IMAGE_VERSION:-2024.06.61@sha256:0ae6065880506115ae1f6b5065003bb5df4e2a34da15e8e70c35ce7da994b3c7}}
  front: &front-image ${FRONT_IMAGE_TAG:-ghcr.io/mailu/nginx:${FRONT_IMAGE_VERSION:-2024.06.61@sha256:f7cf96f13bb8211620437acfad5a67f04677e88545af713d6785b7c2ba947dd9}}
  admin: &admin-image ${ADMIN_IMAGE_TAG:-ghcr.io/mailu/admin:${ADMIN_IMAGE_VERSION:-2024.06.61@sha256:ea2fa6dc7f5fded4790e683f3586f61568a8bdd5924bd07fca0aaa41535fb195}}
  imap: &imap-image ${IMAP_IMAGE_TAG:-ghcr.io/mailu/dovecot:${IMAP_IMAGE_VERSION:-2024.06.61@sha256:ecf9a744018455ddc5f30728241ef355f487b026c84d1456e51e1cd344d0cba7}}
  smtp: &smtp-image ${SMTP_IMAGE_TAG:-ghcr.io/mailu/postfix:${SMTP_IMAGE_VERSION:-2024.06.61@sha256:b04f8f585c33abd29acb1200fe3abda64abb8c6f22a8a0c9259859219791e881}}
  oletools: &oletools-image ${OLETOOLS_IMAGE_TAG:-ghcr.io/mailu/oletools:${OLETOOLS_IMAGE_VERSION:-2024.06.61@sha256:c75f57ad386861a5321d726aa82df4ef5e092a007969f5140a0632e0109cc929}}
  fts-attachments: &fts-attachments-image ${FTS_ATTACHMENTS_IMAGE_TAG:-apache/tika:${FTS_ATTACHMENTS_IMAGE_VERSION:-latest-full@sha256:ab9cc988828c594d32d6409e1850d1c8d83152ea793ef5fe0e7862ac0f9e5891}}
  antispam: &antispam-image ${ANTISPAM_IMAGE_TAG:-ghcr.io/mailu/rspamd:${ANTISPAM_IMAGE_VERSION:-2024.06.61@sha256:a5336c731713e3fbadc443bd42735537e8931a58c8e1a54e809dd2dfba11174f}}
  antivirus: &antivirus-image ${ANTIVIRUS_IMAGE_TAG:-clamav/clamav-debian:${ANTIVIRUS_IMAGE_VERSION:-1.4@sha256:6d0680780fd29855cb7018f68272cb520821f614259e2066f8ec669069ac91b3}}
  webdav: &webdav-image ${WEBDAV_IMAGE_TAG:-ghcr.io/mailu/radicale:${WEBDAV_IMAGE_VERSION:-2024.06.61@sha256:81ef20af084ea3a71807a4114021d48fabe575849176d207d8e99a80701c996a}}
  fetchmail: &fetchmail-image ${FETCHMAIL_IMAGE_TAG:-ghcr.io/mailu/fetchmail:${FETCHMAIL_IMAGE_VERSION:-2024.06.61@sha256:3e808bd347c6976f12e38d814eca1c600b88a8b65c249c206518a975ac212fdb}}
  webmail: &webmail-image ${WEBMAIL_IMAGE_TAG:-ghcr.io/mailu/webmail:${WEBMAIL_IMAGE_VERSION:-2024.06.61@sha256:88e349df5258a6466564658342b7917332c253e8f21f5d3806c6402ff3c882b8}}

networks:
  mailu-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${SUBNET:-192.168.203.0/24}
  radicale:
    driver: bridge
  webmail-network:
    driver: bridge
  clamav-network:
    driver: bridge
  oletools-network:
    driver: bridge
    internal: true
  fts-attachments-network:
    driver: bridge
    internal: true
  traefik-network:
    external: true

volumes:
  mailu-data:
  mailu-fetchmail:
  mailu-dav:
  mailu-mail:
  mailu-redis:
  mailu-filter:
  mailu-mailqueue:
  mailu-webmail:
  mailu-certificates:
  mailu-dkim:
  mailu-override:
  traefik-certificates:
  mailu-backups:

services:
  redis:
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. MAILU_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    # Docker's default is ten seconds, then SIGKILL. That is not always enough
    # for this image to finish shutting down: PostgreSQL has a checkpoint to
    # write, MariaDB has InnoDB to flush, and Redis saves its dataset on the way
    # out. Killed halfway, the next start does crash recovery, and a Redis that
    # held another application's file locks leaves them behind for a person to
    # clear by hand. Sixty seconds, overridable in .env.
    stop_grace_period: ${MAILU_REDIS_STOP_GRACE_PERIOD:-60s}
    deploy:
      resources:
        limits:
          memory: ${MAILU_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${MAILU_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${MAILU_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${MAILU_REDIS_CPU_RESERVATION:-0.1}"
    env_file: .env
    volumes:
      - mailu-redis:/data
    networks:
      - mailu-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    restart: unless-stopped
    depends_on:
      - resolver

  resolver:
    image: *resolver-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_RESOLVER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_RESOLVER_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_RESOLVER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_RESOLVER_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_RESOLVER_CPU_RESERVATION:-0.25}"
    env_file: .env
    networks:
      mailu-network:
        ipv4_address: ${RESOLVER_IP:-192.168.203.254}
    restart: unless-stopped

  front:
    image: *front-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_FRONT_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_FRONT_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_FRONT_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_FRONT_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_FRONT_CPU_RESERVATION:-0.25}"
    env_file: .env
    volumes:
      - mailu-certificates:/certs
      - mailu-override:/overrides:ro
    networks:
      - mailu-network
      - webmail-network
      - radicale
      - traefik-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Define TCP router rules for SMTP on HostSNI
      - "traefik.tcp.routers.smtp.rule=HostSNI(`*`)"
      # Use the SMTP entrypoint for the SMTP service
      - "traefik.tcp.routers.smtp.entrypoints=smtp"
      # Assign the router to the SMTP service
      - "traefik.tcp.routers.smtp.service=smtp"
      # Specify the internal container port for SMTP
      - "traefik.tcp.services.smtp.loadbalancer.server.port=25"
      # Define TCP router rules for SMTPS on HostSNI
      - "traefik.tcp.routers.smtps.rule=HostSNI(`*`)"
      # Use the SMTPS entrypoint for the SMTPS service
      - "traefik.tcp.routers.smtps.entrypoints=smtps"
      # Assign the router to the SMTPS service
      - "traefik.tcp.routers.smtps.service=smtps"
      # Specify the internal container port for SMTPS
      - "traefik.tcp.services.smtps.loadbalancer.server.port=465"
      # Define TCP router rules for Submission on HostSNI
      - "traefik.tcp.routers.submission.rule=HostSNI(`*`)"
      # Use the Submission entrypoint for the Submission service
      - "traefik.tcp.routers.submission.entrypoints=submission"
      # Assign the router to the Submission service
      - "traefik.tcp.routers.submission.service=submission"
      # Specify the internal container port for Submission
      - "traefik.tcp.services.submission.loadbalancer.server.port=587"
      # Define TCP router rules for POP3 on HostSNI
      - "traefik.tcp.routers.pop3.rule=HostSNI(`*`)"
      # Use the POP3 entrypoint for the POP3 service
      - "traefik.tcp.routers.pop3.entrypoints=pop3"
      # Assign the router to the POP3 service
      - "traefik.tcp.routers.pop3.service=pop3"
      # Specify the internal container port for POP3
      - "traefik.tcp.services.pop3.loadbalancer.server.port=110"
      # Define TCP router rules for POP3S on HostSNI
      - "traefik.tcp.routers.pop3s.rule=HostSNI(`*`)"
      # Use the POP3S entrypoint for the POP3S service
      - "traefik.tcp.routers.pop3s.entrypoints=pop3s"
      # Assign the router to the POP3S service
      - "traefik.tcp.routers.pop3s.service=pop3s"
      # Specify the internal container port for POP3S
      - "traefik.tcp.services.pop3s.loadbalancer.server.port=995"
      # Define TCP router rules for IMAP on HostSNI
      - "traefik.tcp.routers.imap.rule=HostSNI(`*`)"
      # Use the IMAP entrypoint for the IMAP service
      - "traefik.tcp.routers.imap.entrypoints=imap"
      # Assign the router to the IMAP service
      - "traefik.tcp.routers.imap.service=imap"
      # Specify the internal container port for IMAP
      - "traefik.tcp.services.imap.loadbalancer.server.port=143"
      # Define TCP router rules for IMAPS on HostSNI
      - "traefik.tcp.routers.imaps.rule=HostSNI(`*`)"
      # Use the IMAPS entrypoint for the IMAPS service
      - "traefik.tcp.routers.imaps.entrypoints=imaps"
      # Assign the router to the IMAPS service
      - "traefik.tcp.routers.imaps.service=imaps"
      # Specify the internal container port for IMAPS
      - "traefik.tcp.services.imaps.loadbalancer.server.port=993"
      # Define TCP router rules for Sieve on HostSNI
      - "traefik.tcp.routers.sieve.rule=HostSNI(`*`)"
      # Use the Sieve entrypoint for the Sieve service
      - "traefik.tcp.routers.sieve.entrypoints=sieve"
      # Assign the router to the Sieve service
      - "traefik.tcp.routers.sieve.service=sieve"
      # Specify the internal container port for Sieve
      - "traefik.tcp.services.sieve.loadbalancer.server.port=4190"
      # Define HTTP router rules for mail service based on hostname
      - "traefik.http.routers.mail.rule=Host(`${MAILU_HOSTNAME:?set in .env - see .env.example}`)"
      # Use the websecure entrypoint for the mail service
      - "traefik.http.routers.mail.entrypoints=websecure"
      # Enable TLS on this router
      - "traefik.http.routers.mail.tls=true"
      # Use Let's Encrypt for TLS certificate management
      - "traefik.http.routers.mail.tls.certresolver=letsencrypt"
      # Specify the internal container port for the HTTP service
      - "traefik.http.services.mail.loadbalancer.server.port=80"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      - resolver

  admin:
    image: *admin-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_ADMIN_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_ADMIN_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_ADMIN_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_ADMIN_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_ADMIN_CPU_RESERVATION:-0.25}"
    env_file: .env
    # The image starts as root and drops to the mailu user (uid 100) —
    # but docker's first-mount copy-up leaves fresh named volumes
    # root-owned, so ownership is fixed here, inside the container,
    # right before startup.
    command: ["/bin/sh", "-c", "chown -R mailu:mailu /data /dkim 2>/dev/null; exec /start.py"]
    volumes:
      - mailu-data:/data
      - mailu-dkim:/dkim
    networks:
      - mailu-network
      - traefik-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.mailu-admin.rule=Host(`${MAILU_ADMIN_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.mailu-admin.service=mailu-admin"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.mailu-admin.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.mailu-admin.loadbalancer.server.port=8080"
      # Enable TLS on this router
      - "traefik.http.routers.mailu-admin.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.mailu-admin.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.mailu-admin.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.mailu-admin.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      resolver:
        condition: service_started

  imap:
    image: *imap-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_IMAP_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_IMAP_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_IMAP_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_IMAP_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_IMAP_CPU_RESERVATION:-0.25}"
    env_file: .env
    # The image starts as root and drops to the mailu user (uid 100) —
    # but docker's first-mount copy-up leaves fresh named volumes
    # root-owned, so ownership is fixed here, inside the container,
    # right before startup.
    command: ["/bin/sh", "-c", "chown -R mailu:mailu /mail 2>/dev/null; exec /start.py"]
    volumes:
      - mailu-mail:/mail
      - mailu-override:/overrides:ro
    networks:
      - mailu-network
      - fts-attachments-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    restart: unless-stopped
    depends_on:
      - front
      - fts-attachments
      - resolver

  smtp:
    image: *smtp-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_SMTP_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_SMTP_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_SMTP_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_SMTP_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_SMTP_CPU_RESERVATION:-0.25}"
    env_file: .env
    # The image starts as root and drops to the mailu user (uid 100) —
    # but docker's first-mount copy-up leaves fresh named volumes
    # root-owned, so ownership is fixed here, inside the container,
    # right before startup.
    command: ["/bin/sh", "-c", "chown -R mailu:mailu /queue 2>/dev/null; exec /start.py"]
    volumes:
      - mailu-mailqueue:/queue
      - mailu-override:/overrides:ro
    networks:
      - mailu-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    restart: unless-stopped
    depends_on:
      - front
      - resolver

  oletools:
    image: *oletools-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_OLETOOLS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_OLETOOLS_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_OLETOOLS_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_OLETOOLS_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_OLETOOLS_CPU_RESERVATION:-0.25}"
    env_file: .env
    hostname: olefy
    networks:
      - oletools-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    restart: unless-stopped
    depends_on:
      - resolver

  fts-attachments:
    image: *fts-attachments-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_FTS_ATTACHMENTS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_FTS_ATTACHMENTS_MEMORY_LIMIT:-1g}
          cpus: "${MAILU_FTS_ATTACHMENTS_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_FTS_ATTACHMENTS_MEMORY_RESERVATION:-128m}
          cpus: "${MAILU_FTS_ATTACHMENTS_CPU_RESERVATION:-0.25}"
    env_file: .env
    hostname: tika
    networks:
      - fts-attachments-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -t1 -O /dev/null http://127.0.0.1:9998/tika || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - resolver

  antispam:
    image: *antispam-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_ANTISPAM_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_ANTISPAM_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_ANTISPAM_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_ANTISPAM_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_ANTISPAM_CPU_RESERVATION:-0.25}"
    env_file: .env
    # The image starts as root and drops to the mailu user (uid 100) —
    # but docker's first-mount copy-up leaves fresh named volumes
    # root-owned, so ownership is fixed here, inside the container,
    # right before startup.
    command: ["/bin/sh", "-c", "chown -R mailu:mailu /var/lib/rspamd 2>/dev/null; exec /start.py"]
    hostname: antispam
    volumes:
      - mailu-filter:/var/lib/rspamd
      - mailu-override:/overrides:ro
    networks:
      - mailu-network
      - oletools-network
      - clamav-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    restart: unless-stopped
    depends_on:
      - front
      - redis
      - oletools
      - antivirus
      - resolver

  antivirus:
    image: *antivirus-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_ANTIVIRUS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_ANTIVIRUS_MEMORY_LIMIT:-2g}
          cpus: "${MAILU_ANTIVIRUS_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${MAILU_ANTIVIRUS_MEMORY_RESERVATION:-256m}
          cpus: "${MAILU_ANTIVIRUS_CPU_RESERVATION:-0.5}"
    env_file: .env
    volumes:
      - mailu-filter:/var/lib/clamav
    networks:
      - clamav-network
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $(cat /tmp/clamd.pid) && kill -0 $(cat /tmp/freshclam.pid)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  webdav:
    image: *webdav-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_WEBDAV_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_WEBDAV_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_WEBDAV_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_WEBDAV_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_WEBDAV_CPU_RESERVATION:-0.25}"
    env_file: .env
    # The image starts as root and drops to the mailu user (uid 100) —
    # but docker's first-mount copy-up leaves fresh named volumes
    # root-owned, so ownership is fixed here, inside the container,
    # right before startup.
    command: ["/bin/sh", "-c", "chown -R mailu:mailu /data 2>/dev/null; exec radicale -S -C /radicale.conf"]
    volumes:
      - mailu-dav:/data
    networks:
      - radicale
      - traefik-network
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.mailu-webdav.rule=Host(`${MAILU_WEBDAV_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.mailu-webdav.service=mailu-webdav"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.mailu-webdav.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.mailu-webdav.loadbalancer.server.port=5232"
      # Enable TLS on this router
      - "traefik.http.routers.mailu-webdav.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.mailu-webdav.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.mailu-webdav.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.mailu-webdav.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped

  fetchmail:
    image: *fetchmail-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_FETCHMAIL_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_FETCHMAIL_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_FETCHMAIL_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_FETCHMAIL_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_FETCHMAIL_CPU_RESERVATION:-0.25}"
    env_file: .env
    volumes:
      # Own volume on purpose: fetchmail runs as its own user (uid 101)
      # and chowns its data dir at startup — sharing admin's volume let
      # that chown break the admin database ownership.
      - mailu-fetchmail:/data
    networks:
      - mailu-network
    dns:
      - ${RESOLVER_IP:-192.168.203.254}
    restart: unless-stopped
    depends_on:
      - admin
      - smtp
      - imap
      - resolver

  webmail:
    image: *webmail-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. MAILU_WEBMAIL_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_WEBMAIL_MEMORY_LIMIT:-512m}
          cpus: "${MAILU_WEBMAIL_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${MAILU_WEBMAIL_MEMORY_RESERVATION:-64m}
          cpus: "${MAILU_WEBMAIL_CPU_RESERVATION:-0.25}"
    env_file: .env
    # The image starts as root and drops to the mailu user (uid 100) —
    # but docker's first-mount copy-up leaves fresh named volumes
    # root-owned, so ownership is fixed here, inside the container,
    # right before startup.
    command: ["/bin/sh", "-c", "chown -R mailu:mailu /data 2>/dev/null; exec /start.py"]
    volumes:
      - mailu-webmail:/data
      - mailu-override:/overrides:ro
    networks:
      - webmail-network
      - traefik-network
    # NOT EXPOSED THROUGH TRAEFIK ON ITS OWN. Mailu's front serves /webmail
    # itself, with the single sign-on that makes webmail and admin one login.
    # Until 24 September 2026 webmail also carried a Traefik router with the
    # same Host() rule as front's: two routers, one rule, no priority, and
    # Traefik picked one at every start. When it picked webmail, /admin/ and
    # /sso/login went to Roundcube and answered 302 to sso.php, then 404, for
    # as long as the stack ran. The clean-machine drill saw it on one start in
    # three; every deployment had the same odds.
    restart: unless-stopped
    depends_on:
      - front

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # Timeouts on the HTTPS entry point. Unset, they are Traefik's own
      # defaults; set them in .env to tune (see .env.example).
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=${TRAEFIK_READ_TIMEOUT:-60s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=${TRAEFIK_WRITE_TIMEOUT:-0s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=${TRAEFIK_IDLE_TIMEOUT:-180s}"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Define the SMTP entry point for email sending on port 25
      - "--entryPoints.smtp.address=:25"
      # Define the SMTPS entry point for secure email sending on port 465
      - "--entryPoints.smtps.address=:465"
      # Define the Submission entry point for email submission on port 587
      - "--entryPoints.submission.address=:587"
      # Define the POP3 entry point for receiving emails on port 110
      - "--entryPoints.pop3.address=:110"
      # Define the secure POP3S entry point for secure email receiving on port 995
      - "--entryPoints.pop3s.address=:995"
      # Define the IMAP entry point for email access on port 143
      - "--entryPoints.imap.address=:143"
      # Define the secure IMAPS entry point for secure email access on port 993
      - "--entryPoints.imaps.address=:993"
      # Define the Sieve entry point for email filtering on port 4190
      - "--entryPoints.sieve.address=:4190"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "995:995"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. MAILU_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${MAILU_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${MAILU_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${MAILU_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${MAILU_BACKUPS_CPU_RESERVATION:-0.1}"
    # Every cycle: a consistent online copy of each SQLite database through
    # Python's backup API (no application stop), then a tar.gz of the rest of
    # the data directory (paths inside the archive start with data/ and extra/; live database files excluded - the copies above are
    # the consistent ones). Logs OK/FAILED per artefact; a failed archive is
    # kept as .failed for diagnosis; retention 0 disables pruning.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep "$$MAILU_BACKUP_INIT_SLEEP"
        while true; do
          STAMP="$$(date +%Y-%m-%d_%H-%M)"
          for db in main.db; do
            DB_FILE="$$MAILU_BACKUPS_PATH/$$MAILU_BACKUP_NAME-$${db%%.*}-$$STAMP.sqlite3"
            echo "[$$(date -Iseconds)] Starting database backup of $$db to $$DB_FILE.gz"
            if [ ! -f "/data/$$db" ]; then
              echo "[$$(date -Iseconds)] Database $$db not present yet (first start?) - skipped this cycle"
            elif python3 -c "import sqlite3,sys; s=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True); d=sqlite3.connect(sys.argv[2]); s.backup(d); d.close(); s.close()" "/data/$$db" "$$DB_FILE" && gzip -f "$$DB_FILE"; then
              echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE.gz ($$(stat -c %s "$$DB_FILE.gz") bytes)"
            else
              echo "[$$(date -Iseconds)] Database backup FAILED - $$db could not be copied consistently" >&2
              rm -f "$$DB_FILE" "$$DB_FILE.gz"
            fi
          done
          DATA_FILE="$$MAILU_BACKUPS_PATH/$$MAILU_DATA_BACKUP_NAME-$$STAMP.tar.gz"
          echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE"
          tar -C / --exclude='data/main.db' --exclude='data/main.db-wal' --exclude='data/main.db-shm' -zcpf "$$DATA_FILE.partial" data extra/mail extra/dkim; RC=$$?
          # BusyBox tar exits 1 for everything from "file changed" to "cannot
          # write", so the exit code proves nothing: verify the archive itself.
          if [ "$$RC" -le 1 ] && [ -f "$$DATA_FILE.partial" ] && gzip -t "$$DATA_FILE.partial" 2>/dev/null; then
            mv "$$DATA_FILE.partial" "$$DATA_FILE";
            echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)"
          else
            echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2
            mv "$$DATA_FILE.partial" "$$DATA_FILE.failed" 2>/dev/null || true
          fi
          if [ "$${MAILU_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
            find "$$MAILU_BACKUPS_PATH" -type f \( -name "$$MAILU_BACKUP_NAME-*" -o -name "$$MAILU_DATA_BACKUP_NAME-*" \) -mtime "+$$MAILU_BACKUP_PRUNE_DAYS" -delete
          fi
          sleep "$$MAILU_BACKUP_INTERVAL"
        done
    volumes:
      - mailu-data:/data
      - mailu-mail:/extra/mail
      - mailu-dkim:/extra/dkim
      - mailu-backups:${MAILU_BACKUPS_PATH:-/srv/mailu/backups}
    environment:
      MAILU_BACKUP_INIT_SLEEP: ${MAILU_BACKUP_INIT_SLEEP:-30m}
      MAILU_BACKUP_INTERVAL: ${MAILU_BACKUP_INTERVAL:-24h}
      MAILU_BACKUP_PRUNE_DAYS: ${MAILU_BACKUP_PRUNE_DAYS:-7}
      MAILU_BACKUPS_PATH: ${MAILU_BACKUPS_PATH:-/srv/mailu/backups}
      MAILU_BACKUP_NAME: ${MAILU_BACKUP_NAME:-mailu-database-backup}
      MAILU_DATA_BACKUP_NAME: ${MAILU_DATA_BACKUP_NAME:-mailu-data-backup}
    restart: unless-stopped
